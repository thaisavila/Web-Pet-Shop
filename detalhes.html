<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/detalhes.css">
  <script src="js/detalhes.js" defer></script>

</head>
<body id="page-category" class="page">
  <!-- 3. [página 3] Para cada item, deve existir uma página de detalhes do serviço com informações detalhadas,
utilizando parágrafos e listas. A página deve apresentar, de forma organizada, informações como: nome do
serviço, descrição, duração média, profissional responsável, cuidados necessários, valor estimado e
imagem ilustrativa. -->

<header id="site-header">
  <div class="container">
    <nav class="main">
      <a href="index.html" class="logo" onclick="navigate('home');return false;">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2">
            <path d="M11 4C11 5.65685 9.65685 7 8 7C6.34315 7 5 5.65685 5 4C5 2.34315 6.34315 1 8 1C9.65685 1 11 2.34315 11 4Z"/><path d="M19 4C19 5.65685 17.6569 7 16 7C14.3431 7 13 5.65685 13 4C13 2.34315 14.3431 1 16 1C17.6569 1 19 2.34315 19 4Z"/><path d="M4 11C4 12.6569 2.65685 14 1 14C-0.656854 14 -2 12.6569 -2 11C-2 9.34315 -0.656854 8 1 8C2.65685 8 4 9.34315 4 11Z" transform="translate(3,0)"/><path d="M23 11C23 12.6569 21.6569 14 20 14C18.3431 14 17 12.6569 17 11C17 9.34315 18.3431 8 20 8C21.6569 8 23 9.34315 23 11Z"/><path d="M12 10C8 10 4 13 4 17C4 20 7 23 12 23C17 23 20 20 20 17C20 13 16 10 12 10Z"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="name">Pet<span>Care</span></span>
          <span class="tagline">Cuidado com amor</span>
        </div>
      </a>

      <div class="nav-links">
        <a href="index.html" onclick="navigate('home'); return false;" class="active" id="nav-inicio">Início</a>
        <a href="#servicos">Serviços</a>
        <a href="#sobre">Sobre</a>
        <a href="#contato">Contato</a>
      </div>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline btn-sm" onclick="navigate('login');return false;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Entrar
        </a>
        <a href="agendamento.html" class="btn btn-primary btn-sm cart-btn" onclick="navigate('agendamento');return false;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
          <span class="desktop-only">Agendamentos</span>
          <span class="cart-badge" id="cart-badge"></span>
        </a>
        <button class="hamburger" id="hamburger-btn" aria-label="Menu">
          <svg id="ham-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <svg id="ham-close" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </nav>
  </div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="index.html" onclick="navigate('home');closeMobile();return false;">Início</a>
    <a href="#servicos" onclick="closeMobile()">Serviços</a>
    <a href="#sobre" onclick="closeMobile()">Sobre</a>
    <a href="#contato" onclick="closeMobile()">Contato</a>
    <a href="#" onclick="navigate('login');closeMobile();return false;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="vertical-align:middle;margin-right:4px"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Entrar na conta
    </a>
  </div>
</header>


<div class="page active">
  <section style="padding-top:36px">
    <div class="container">
      <a href="javascript:history.back()" class="back-btn" id="service-back-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>Voltar</a>
      <div class="detail-grid" id="service-detail-content"></div>
    </div>
  </section>
</div>





<script src="js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const svcId = params.get('id');
  if (!svcId) return window.location.href = 'index.html';

  let s;
  try {
    s = await api.detalharServico(svcId);
  } catch (e) {
    console.error(e);
    return window.location.href = 'index.html';
  }

  // "cuidados" é armazenado como texto único no banco (não uma lista).
  // Se cada cuidado estiver separado por ";" ou quebra de linha no seed,
  // isso já vira uma lista de itens automaticamente.
  const cuidadosItens = (s.cuidados || '')
    .split(/;|\n/)
    .map(i => i.trim())
    .filter(Boolean);

  const cuidadosHtml = cuidadosItens.length
    ? `<div class="detail-list"><h3>Cuidados Necessários</h3>
        ${cuidadosItens.length > 1
          ? `<ul>${cuidadosItens.map(i => `<li>${i}</li>`).join('')}</ul>`
          : `<p>${cuidadosItens[0]}</p>`}
       </div>`
    : '';

  document.getElementById('service-detail-content').innerHTML = `
    <div>
      <div class="detail-img"><img src="${resolveImg(s.imagem_url)}" alt="${s.nome}" /></div>
      <div class="detail-body" style="margin-top:24px">
        <h1>${s.nome}</h1>
        <div class="detail-meta">
          <span class="meta-chip">${getIcon('clock',14,'#4CAF7A')} ${s.duracao_media ?? ''}</span>
          <span class="meta-chip">${getIcon('user',14,'#4CAF7A')} ${s.profissional ?? ''}</span>
        </div>
        <p class="detail-desc">${s.descricao_completa ?? s.descricao_curta ?? ''}</p>
        ${cuidadosHtml}
      </div>
    </div>
    <div>
      <div class="booking-card">
        <h3>${s.nome}</h3>
        <div class="booking-price">R$ ${s.valor_estimado != null ? Number(s.valor_estimado).toFixed(2) : '—'}</div>
        <button class="btn btn-primary add-cart-btn" onclick="addToCart(${s.id}, '${escAttr(s.nome)}', ${s.valor_estimado ?? 'null'}, '${escAttr(s.duracao_media ?? '')}')">${getIcon('cart',16,'white')} Adicionar ao agendamento</button>
        <button class="btn btn-outline add-cart-btn" style="margin-top:10px; " onclick="window.location.href='agendamento.html'"> ${getIcon('calendar',16,'var(--dark)')} Ver agendamentos</button>
      </div>
    </div>
  `;
});
</script>



</body>
</html>
