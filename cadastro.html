<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="css/cadastro.css">
  <script src="js/cadastro.js" defer></script>

</head>

<body>
  <form action="" id="form">
  <div>
    <h1>Cadastro</h1>
    <p>Cadastre-se para agendar serviços para seu pet</p>
    

  </div>

  <section class="container">
    <div class="container_titulo">
      <h5>Dados do Tutor</h5>
      <p>Informações pessoais do responsável pelo pet</p>
    </div>

    <div class="container_conteudo">
      <div class="label_input">
        <label for="nome_dono">Nome completo *</label>
        <input type="text" id="nome_dono" name="nome_dono" placeholder="Seu nome completo" onblur="erro_nome()">
        <small class="erro" id="erro_nome"></small>
        <small class="ok" id="ok_nome"></small>
      </div>

      <div class="label_input">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" placeholder="nome@gmail.com" onblur="erro_email()">
        <small class="erro" id="erro_email"></small>
        <small class="ok" id="ok_email"></small>
      </div>

      <div class="label_input">
        <label for="cpf">CPF *</label>
        <input type="number" id="cpf" name="cpf" placeholder="000.000.000-00" onblur="erro_cpf()">
        <small class="erro" id="erro_cpf"></small>
        <small class="ok" id="ok_cpf"></small>
      </div>

      <div class="label_input">
        <label for="endereco">Endereço * </label>
        <input type="text" id="endereco" name="endereco" placeholder="Sua Rua" onblur="erro_endereco()">
        <small class="erro" id="erro_endereco"></small>
        <small class="ok" id="ok_endereco"></small>
      </div>

      <div class="label_input">
        <label for="cidade">Cidade * </label>
        <input type="text" id="cidade" name="cidade" placeholder="Sua Cidade" onblur="erro_cidade()">
        <small class="erro" id="erro_cidade"></small>
        <small class="ok" id="ok_cidade"></small>
      </div>

      <div class="label_input">
        <label for="senha_1">Senha * </label>
        <input type="password" id="senha_1" name="senha_1" placeholder="Crie uma senha" onblur="erro_senha()">
        <small class="erro" id="erro_senha"></small>
        <small class="ok" id="ok_senha"></small>
      </div>

      <div class="label_input">
        <label for="senha">Digite novamente a senha * </label>
        <input type="password" id="senha" name="senha" placeholder="Senha" onblur="erro_repetir_senha()">
        <small class="erro" id="erro_repetir_senha"></small>
        <small class="ok" id="ok_repetir_senha"></small>
      </div>
    </div>
  </section>

  <section class="container">
    <div class="container_titulo">
      <h5>Dados do Pet</h5>
      <p>Informações sobre seu animal de estimação</p>
    </div>

    <section class="container_conteudo">
      <div class="label_input">
        <label for="nome_pet">Nome do Pet * </label>
        <input type="text" id="nome_pet" name="nome_pet" placeholder="Digite o nome do seu Pet" onchange="nome_pet()">
        <small class="erro" id="erro_nome_pet"></small>
        <small class="ok" id="ok_nome_pet"></small>
      </div>

      <div class="label_input">
        <label for="especie">Especie * </label>
        <input type="text" id="especie" name="especie" placeholder="Digite a espécie do seu Pet" onchange="especie()">
        <small class="erro" id="erro_especie"></small>
        <small class="ok" id="ok_especie"></small>
        
      </div>
      <div class="label_input">
        <label for="raca">Raça * </label>
        <input type="text" id="raca" name="raca" placeholder="Digite a raça do seu Pet" onchange="raca()">
        <small class="erro" id="erro_raca"></small>
        <small class="ok" id="ok_raca"></small>
      </div>

      <div class="label_input">
        <label for="idade_pet">Idade * </label>
        <input type="text" id="idade_pet" name="idade_pet" placeholder="Digite a idade do seu pet" onchange="idade_pet()">
        <small class="erro" id="erro_idade_pet"></small>
        <small class="ok" id="ok_idade_pet"></small>
      </div>


      <div class="label_input">
        <label for="peso_pet">Peso * </label>
        <input type="number" id="peso_pet" name="peso_pet" placeholder="Digite o peso do seu Pet" onchange="peso_pet()">
        <small class="erro" id="erro_peso_pet"></small>
        <small class="ok" id="ok_peso_pet"></small>
      </div>

      <div class="label_input">
        <label for="telefone">Telefone do Tutor * </label>
        <input type="number" id="telefone" name="telefone" placeholder="Digite o seu telefone" onchange="peso_pet()">
        <small class="erro" id="erro_telefone"></small>
        <small class="ok" id="ok_telefone"></small>
      </div>

    </section>
  </section>

  <section>
    <div id="div_botoes">
      <button type="button" id="cancelar"><a href="index.html">Cancelar</a></button>
      <button type="submit" id="cadastrar" onclick="validar_cadastro()">Finalizar Cadastro</button>
    </div>
    <div id="fim">
      <p>Já tem uma conta?</p>
      <a href="login.html">Login</a>
    </div>
  </section>
</form>
</body>

</html>
