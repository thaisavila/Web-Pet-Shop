<!-- 2. [página 2] Para cada categoria, deve existir uma página de serviços com a listagem de serviços em
formato de cards.
a. Cada serviço deve ser apresentado em uma seção. Exibir pelo menos 5 itens por categoria, cada um em
formato de card, contendo imagem coerente com o contexto;
b. Esta página deve obedecer à responsividade da tela, reorganizando a exibição dos itens de acordo com a
largura da página;
c. Quando qualquer uma das imagens dos itens for clicada, o usuário deve ser direcionado para a página de
detalhes do serviço (página 3). -->

<div id="page-service" class="page">
  <section style="padding-top:36px">
    <div class="container">
      <a href="" class="back-btn" id="service-back-btn" onclick="return false;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar
      </a>
      <div class="detail-grid" id="service-detail-content"></div>
    </div>
  </section>
</div>








<script src="js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const catId = params.get('cat');

  if (!catId) {
    window.location.href = 'index.html';
    return;
  }

  try {
    const [cat, services] = await Promise.all([
      api.detalharCategoria(catId),
      api.listarServicosPorCategoria(catId),
    ]);

    document.getElementById('cat-title').textContent = cat.nome;
    document.getElementById('cat-desc').textContent = cat.descricao ?? '';
    document.getElementById('cat-icon-wrap').innerHTML = getIcon(iconForCategoria(cat.nome), 28, '#4CAF7A');

    document.getElementById('category-services-grid').innerHTML = services.map(s => `
      <div class="card" onclick="window.location.href='detalhes.html?id=${s.id}'">
        <div class="card-img">
          <img src="${resolveImg(s.imagem_url)}" alt="${s.nome}" />
          <div class="card-img-overlay"></div>
        </div>
        <div class="card-body">
          <div class="card-title">${s.nome}</div>
          <div class="card-desc">${s.descricao_curta ?? ''}</div>
          <div class="price-row" style="margin-top:10px">
            <span class="price">R$ ${s.valor_estimado != null ? Number(s.valor_estimado).toFixed(2) : '—'}</span>
            <span class="duration">${s.duracao_media ?? ''}</span>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-primary btn-sm" style="width:100%;justify-content:center"
            onclick="event.stopPropagation();addToCart(${s.id}, '${escAttr(s.nome)}', ${s.valor_estimado ?? 'null'}, '${escAttr(s.duracao_media ?? '')}')">
            Agendar ${getIcon('cart', 13, 'white')}
          </button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    console.error(e);
    document.getElementById('category-services-grid').innerHTML = '<p>Não foi possível carregar os serviços desta categoria.</p>';
  }
  
});


</script>


</body>
</html>
