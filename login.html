<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  
  <section id="section_principal">
    <button id="button_home"><a href="index.html" style="text-decoration: none; font-family: 'Inter', sans-serif;">Voltar</a></button>

    <div id="titulos">
      <h1>Bem-vindo de volta!</h1>
      <p>Acesse sua conta para gerenciar seus agendamentos</p>
    </div>

      <section>
        <form action="" id="form_login">
          <div id="inputs">
          <label for="email_login">Email</label>
          <input type="email" id="email_login" name="email_login" placeholder="Digite seu email">

          <label for="senha_login">Senha</label>
          <input type="password" id="senha_login" name="senha_login" placeholder="Digite sua senha">
          
          <div>
          <input type="checkbox" id="conectado" name="conectado" style="margin-left: 5px; margin-top: 5px;">
          <label for="conectado" style="text-decoration: none; font-family: 'Inter', sans-serif;">Manter conectado</label>
          </div>
          </div>

          <div id="fim">
          <button id="entrar" type="submit">Entrar na conta</button>

          <p id="mensagem_login"></p>

          <div id="cadastro">
            <p>Não tem uma conta? </p>
            <a href="cadastro.html" style="text-decoration: none; font-family: 'Inter', sans-serif; text-indent: 5px;"> Cadastre-se</a>
          </div>
          </div>
        </form>
      </section>
    
  </section>

  <script src="js/login.js"></script>
</body>

</html>
